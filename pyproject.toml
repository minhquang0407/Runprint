[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "runprint"
version = "0.1.3"
description = "Run anything. Capture everything needed to reproduce it."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Runprint Contributors" }
]

keywords = ["reproducibility", "research", "ml", "experiment-tracking", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/minhquang0407/Runprint"
Repository = "https://github.com/minhquang0407/Runprint"
Issues = "https://github.com/minhquang0407/Runprint/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
qr = "qr.cli:main"
runprint = "qr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
