# Tuned Configuration: Gradient Boosting
experiment:
  name: "breast_cancer_gb_tuned"
  seed: 42

dataset:
  path: "ml_experiment/data/cancer_dataset.csv"
  target_col: "target"
  test_size: 0.2

model:
  type: "gradient_boosting"
  n_estimators: 150
  learning_rate: 0.05
  max_depth: 4
  random_state: 42
